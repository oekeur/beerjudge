name: CI

# Docs-only changes (plans, Backlog tasks, docs site, Markdown) skip CI; a
# change that also touches code runs every job.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'planning/**'
      - 'docs/**'
      - 'wiki/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'planning/**'
      - 'docs/**'
      - 'wiki/**'
      - '**/*.md'

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: touch database/database.sqlite
      - run: php artisan migrate --force
      - run: php artisan test --compact

  tests-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: beerjudge_test
          POSTGRES_USER: beerjudge
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beerjudge -d beerjudge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # phpunit.xml sets DB_CONNECTION=sqlite and DB_DATABASE=:memory: without
    # force, so these job-level values win over it.
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: beerjudge_test
      DB_USERNAME: beerjudge
      DB_PASSWORD: secret
      DB_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan migrate --force
      - run: php artisan db:show --json | grep -q '"pgsql"'
      - run: php artisan test --compact

  browser-tests:
    runs-on: ubuntu-latest
    # A stalled step (apt mirrors have hung for 12+ minutes) fails fast instead of
    # running to the 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      # No --with-deps: it runs apt-get update on every run, even on a browser cache
      # hit, and that has stalled on Ubuntu mirrors. The runner image already ships
      # the system libraries Chromium needs.
      - run: npx playwright install chromium
      - name: Create browser-test environment
        run: |
          cp .env.browser-test.example .env.browser-test
          sed -i "s|DB_DATABASE=.*|DB_DATABASE=$(pwd)/database/browser-test.sqlite|" .env.browser-test
          php artisan key:generate --env=browser-test
          cp .env.browser-test .env
          touch database/browser-test.sqlite
      - run: VITE_SKIP_FONTS=1 npm run build
      - run: php artisan migrate --force --env=browser-test
      - name: Start app server and wait for it to be ready
        run: |
          APP_ENV=browser-test php artisan serve --host=0.0.0.0 --port=8000 &
          npx wait-on http://127.0.0.1:8000/up --timeout 30000
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
