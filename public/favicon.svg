<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <!-- Background -->
    <rect width="512" height="512" fill="#1c1917"/>

    <!-- Vaasje glass body: straight taper, flat foot (no flare) -->
    <path d="M 170,130 L 342,130 L 310,400 L 202,400 Z" fill="#d97706"/>

    <!-- Foot line -->
    <rect x="202" y="397" width="108" height="6" rx="2" fill="#92400e"/>

    <!-- Glass rim line -->
    <line x1="170" y1="130" x2="342" y2="130" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.6"/>

    <!-- Foam: calm, near-flat beer head with rounded corners -->
    <path d="M 176,140
           C 170,140 170,136 170,130
           C 178,122 200,120 218,124
           C 238,128 248,119 270,122
           C 292,125 302,129 318,123
           C 332,118 342,123 342,130
           C 342,136 342,140 336,140
           Z" fill="#fef9ee"/>

    <!-- Bubbles in the foam -->
    <circle cx="192" cy="134" r="3" fill="#fde9c8" opacity="0.85"/>
    <circle cx="214" cy="131" r="2.5" fill="#fde9c8" opacity="0.85"/>
    <circle cx="236" cy="135" r="2" fill="#fde9c8" opacity="0.8"/>
    <circle cx="262" cy="130" r="2.5" fill="#fde9c8" opacity="0.85"/>
    <circle cx="286" cy="134" r="3" fill="#fde9c8" opacity="0.8"/>
    <circle cx="308" cy="131" r="2" fill="#fde9c8" opacity="0.85"/>
    <circle cx="326" cy="135" r="2.5" fill="#fde9c8" opacity="0.8"/>

    <!-- Maskable safe-zone guide (visual check only, remove for production) -->
    <!-- <circle cx="256" cy="256" r="204.8" fill="none" stroke="red" stroke-width="2"/> -->
</svg>
