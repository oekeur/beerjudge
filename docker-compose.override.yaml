services:
  app:
    environment:
      APP_DEBUG: "true"
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - vendor:/var/www/vendor
      - build:/var/www/public/build
      - storage:/var/www/storage
      - bootstrap_cache:/var/www/bootstrap/cache

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

volumes:
  vendor:
  build:
  storage:
  bootstrap_cache:
