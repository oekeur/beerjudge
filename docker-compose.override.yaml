# Auto-merged by Docker Compose for local dev (docker-compose up).
# Production: docker-compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d
services:
  app:
    env_file: .env
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - storage:/var/www/storage
      - bootstrap_cache:/var/www/bootstrap/cache
    entrypoint: /entrypoint.dev.sh

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  vite:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - vite_node_modules:/app/node_modules

volumes:
  storage:
  bootstrap_cache:
  vite_node_modules:
