# Production overlay. Use with: docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d
services:
  app:
    restart: unless-stopped
    env_file: .env.production
    networks:
      - default
      - proxy

  postgres:
    networks:
      - default

  redis:
    networks:
      - default

networks:
  proxy:
    external: true
